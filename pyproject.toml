[project]
name = "busadda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Login>=0.6,<1",
    "Flask-WTF>=1.2,<2",
    "Flask-Migrate>=4,<5",
    "PyMySQL[rsa]>=1.1,<2",
    "python-dotenv>=1,<2",
    "email-validator>=2,<3",
    "waitress>=3,<4",
]

[tool.vercel]
entrypoint = "run:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
